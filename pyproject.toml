[project]
name = "toolharness"
version = "0.1.0"
description = "Harness to self-identify bad tool responses."
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.10"  # the mcp SDK requires 3.10+
license = "MIT"

dependencies = [
    "mcp",
    "pydantic",
    "openai",
    "datasets",
    "pandas",
    "matplotlib",
    "python-dotenv",
    "rank-bm25",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"
